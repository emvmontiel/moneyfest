<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moneyfest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #f6f6f3; --surface: #ffffff; --sunken: #efefea; --line: #e0e0da;
  --ink: #1f2328; --muted: #676d75; --accent: #2563eb; --accent-ink: #ffffff;
  --earn: #16803c; --spend: #b91c1c; --debt: #9a5b00; --move: #4b5fa8; --warn: #a16207;
  --earn-soft: #e5f3ea; --spend-soft: #fbeaea; --debt-soft: #fbf0dd; --accent-soft: #e7eefd;
  --radius: 12px;
  --sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121416; --surface: #1a1d20; --sunken: #23272b; --line: #30353a;
    --ink: #eceef0; --muted: #9aa0a8; --accent: #6b9bff; --accent-ink: #0d1424;
    --earn: #4cc27e; --spend: #f07070; --debt: #e2ac55; --move: #9aa9e6; --warn: #e2ac55;
    --earn-soft: #18301f; --spend-soft: #351b1b; --debt-soft: #33280f; --accent-soft: #1b2540;
  }
}
:root[data-theme="dark"] {
  --bg: #121416; --surface: #1a1d20; --sunken: #23272b; --line: #30353a;
  --ink: #eceef0; --muted: #9aa0a8; --accent: #6b9bff; --accent-ink: #0d1424;
  --earn: #4cc27e; --spend: #f07070; --debt: #e2ac55; --move: #9aa9e6; --warn: #e2ac55;
  --earn-soft: #18301f; --spend-soft: #351b1b; --debt-soft: #33280f; --accent-soft: #1b2540;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.num { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { max-width: 760px; margin: 0 auto; padding: 20px 16px 130px; }
.banner { background: var(--debt-soft); border-radius: var(--radius); padding: 10px 14px; font-size: 13.5px; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner.info { background: var(--accent-soft); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; text-decoration: underline; }

h1.title { font-family: var(--serif); font-weight: 600; font-size: 28px; margin: 4px 0 14px; }
h2.sec { font-family: var(--serif); font-weight: 600; font-size: 21px; margin: 26px 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
h2.sec .side { font-family: var(--sans); font-size: 13.5px; font-weight: 600; color: var(--muted); }
h3.sub { font-size: 15px; margin: 18px 0 8px; }
.muted { color: var(--muted); font-size: 13.5px; }
.small { font-size: 12.5px; }

.onhand { margin: 6px 0 18px; }
.onhand-label { color: var(--muted); font-size: 13.5px; }
.onhand-total { font-family: var(--serif); font-weight: 600; font-size: clamp(38px, 10vw, 54px); line-height: 1.05; letter-spacing: -0.01em; }
.onhand-total.neg { color: var(--spend); }
.strip { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.pill { flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; white-space: nowrap; }
.pill b { font-weight: 700; margin-left: 4px; }

.seg { display: flex; background: var(--sunken); border-radius: 10px; padding: 3px; gap: 3px; margin-bottom: 12px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 8px; padding: 8px 6px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.panel + .panel { margin-top: 14px; }
.notebox { width: 100%; min-height: 92px; resize: vertical; border: 0; outline: none; background: transparent; font-family: var(--serif); font-size: 19px; line-height: 1.45; padding: 2px 0; }
.notebox::placeholder { color: var(--muted); opacity: .7; }
.notebox-wrap { border-bottom: 1.5px dashed var(--line); padding-bottom: 8px; margin-bottom: 10px; }
.notebox-wrap:focus-within { border-bottom-color: var(--accent); }
.noteinput { width: 100%; border: 0; border-bottom: 1.5px dashed var(--line); background: transparent; font-family: var(--serif); font-size: 19px; padding: 4px 0 10px; outline: none; border-radius: 0; }
.noteinput:focus { border-bottom-color: var(--accent); }
.noteinput::placeholder { color: var(--muted); opacity: .7; }
.hint { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.tools-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 4px; align-items: center; }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin: 10px 0 4px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; min-width: 0; }
.field input, .field select, .field textarea, .inp {
  font-weight: 500; font-size: 15px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; min-width: 0; width: 100%;
}
.field textarea { resize: vertical; min-height: 60px; }
.grow { flex: 1 1 160px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--ink); }
.check input { width: 18px; height: 18px; }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 600; }
.chip-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.freq { display: flex; gap: 7px; flex-wrap: wrap; margin: 4px 0 12px; }
.freq button { border: 1px dashed var(--line); background: var(--bg); border-radius: 999px; padding: 5px 11px; font-size: 13px; }
.freq button span { color: var(--muted); margin-left: 4px; }

.preview { list-style: none; margin: 0; padding: 0; }
.prow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.prow:first-child { border-top: 0; }
.prow-name { font-weight: 600; overflow-wrap: anywhere; }
.prow-amt { font-weight: 700; text-align: right; }
.prow-amt.in { color: var(--earn); }
.prow-cat { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sel { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 8px; font-size: 13.5px; max-width: 100%; }
.sel.unset { border-color: var(--warn); color: var(--warn); }
.prow-err { color: var(--spend); font-size: 13px; }
.status { font-size: 12px; color: var(--muted); }
.status.rule { color: var(--earn); font-weight: 600; }
.tagchip { display: inline-block; font-size: 11.5px; font-weight: 700; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 8px; margin-right: 4px; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 10px; padding: 11px 18px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--spend); border: 1px solid var(--line); }
.btn.small { padding: 7px 12px; font-size: 13.5px; }
.btn.tiny { padding: 4px 10px; font-size: 12.5px; border-radius: 8px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
.form-msg { font-size: 13px; color: var(--spend); min-height: 1.2em; margin-top: 8px; }

/* review */
.review { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.rv { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 11px 14px; border-top: 1px solid var(--line); }
.review li:first-child .rv { border-top: 0; }
.rv-name { font-weight: 600; overflow-wrap: anywhere; background: none; border: 0; padding: 0; text-align: left; }
.rv-amt { font-weight: 700; text-align: right; }
.rv-amt.in { color: var(--earn); }
.rv-meta { font-size: 12.5px; color: var(--muted); grid-column: 1 / -1; margin-top: -4px; }
.rv-act { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; }
.rv-act .sel { flex: 1; }
.okbtn { border: 1px solid var(--earn); color: var(--earn); background: var(--earn-soft); border-radius: 8px; padding: 5px 12px; font-weight: 800; }
.okbtn:disabled { opacity: .4; }

/* entries */
.daygroup { margin-bottom: 16px; }
.dayhead { display: flex; justify-content: space-between; align-items: baseline; font-size: 13.5px; color: var(--muted); font-weight: 700; padding: 0 2px 6px; }
.entries { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.entries li { display: flex; align-items: stretch; border-top: 1px solid var(--line); }
.entries li:first-child { border-top: 0; }
.entries li.is-hidden .entry { opacity: .55; }
.pick { display: flex; align-items: center; padding-left: 12px; }
.pick input { width: 20px; height: 20px; }
.entry { flex: 1; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 11px 14px; width: 100%; text-align: left; background: none; border: 0; min-width: 0; }
.entry:hover { background: var(--sunken); }
.entry-name { font-weight: 600; overflow-wrap: anywhere; }
.entry-meta { font-size: 12.5px; color: var(--muted); grid-column: 1; overflow-wrap: anywhere; }
.entry-amt { font-weight: 700; grid-row: 1 / span 2; grid-column: 2; align-self: center; text-align: right; }
.flag { font-size: 11px; font-weight: 800; color: var(--warn); margin-left: 6px; }
.k-income .entry-amt { color: var(--earn); }
.k-expense .entry-amt, .k-forgiven .entry-amt { color: var(--spend); }
.k-lent .entry-amt, .k-borrowed .entry-amt, .k-got_back .entry-amt, .k-paid_back .entry-amt { color: var(--debt); }
.k-transfer .entry-amt { color: var(--move); }
.empty { color: var(--muted); padding: 18px; text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); }

.searchbar { display: flex; gap: 8px; margin-bottom: 10px; }
.searchbar input { flex: 1; }
.filters { margin-bottom: 12px; }
.filters .form-grid { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 520px) { .filters .form-grid { grid-template-columns: 1fr 1fr; } }
.resultline { font-size: 13.5px; color: var(--muted); margin: 6px 2px 12px; }

.bulkbar { position: fixed; left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); z-index: 25; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0,0,0,.08); padding: 10px 16px; }
.bulkbar-inner { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.bulkbar .count { font-weight: 800; margin-right: auto; }

/* nav row */
.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.monthnav h1 { margin: 0; text-align: center; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 40px; height: 40px; display: grid; place-items: center; flex: none; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.stat { background: var(--surface); padding: 12px 14px; }
.stat-l { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.stat-v { font-size: 20px; font-weight: 700; }
.stat-v.in { color: var(--earn); } .stat-v.out { color: var(--spend); }
.bars { list-style: none; margin: 0; padding: 0; }
.bar { display: grid; grid-template-columns: 120px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; font-size: 14px; }
.track { height: 10px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; background: var(--spend); border-radius: 99px; opacity: .8; }
.fill.ok { background: var(--earn); } .fill.warn { background: var(--warn); } .fill.blue { background: var(--accent); }
.fill.neutral { background: var(--muted); opacity: .55; }
.bar-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-amt { font-weight: 700; }

/* budget */
.big-left { font-family: var(--serif); font-size: 34px; font-weight: 600; line-height: 1.1; }
.big-left.neg { color: var(--spend); }
.brow { padding: 10px 0; border-top: 1px solid var(--line); }
.brow:first-of-type { border-top: 0; }
.brow-top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; margin-bottom: 6px; }
.brow-top b { font-weight: 700; }
.brow-sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.bedit { display: grid; grid-template-columns: 1fr 130px 110px; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.bedit:first-child { border-top: 0; }
.bedit input { text-align: right; }
@media (max-width: 420px) { .bedit { grid-template-columns: 1fr 112px 88px; } }

/* bills & goals */
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.list > li { padding: 12px 14px; border-top: 1px solid var(--line); }
.list > li:first-child { border-top: 0; }
.li-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.li-name { font-weight: 700; }
.li-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.badge { display: inline-block; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 2px 9px; }
.b-paid { background: var(--earn-soft); color: var(--earn); }
.b-diff { background: var(--debt-soft); color: var(--warn); }
.b-missed { background: var(--spend-soft); color: var(--spend); }
.b-soon { background: var(--sunken); color: var(--muted); }

/* more menu */
.menu { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.menu button { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
.menu li:first-child button { border-top: 0; }
.menu .muted { font-weight: 500; }
.back { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
.people { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.person { border-top: 1px solid var(--line); }
.people li:first-child { border-top: 0; }
.person summary { display: flex; justify-content: space-between; gap: 10px; padding: 12px 14px; cursor: pointer; list-style: none; font-weight: 600; }
.person summary::-webkit-details-marker { display: none; }
.person-amt { font-weight: 800; color: var(--debt); }
.person-body { padding: 0 14px 14px; }
.set-list { list-style: none; margin: 0; padding: 0; }
.set-row { display: flex; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.set-list li:first-child { border-top: 0; }
.set-row input[type="text"], .set-row input[type="number"], .set-row select { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
.set-row input[type="number"] { flex: 0 0 120px; text-align: right; }
.set-row .tag { font-size: 12px; color: var(--muted); flex: none; width: 58px; }
.set-row label.hide { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 4px; flex: none; }
.set-add { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.set-add input, .set-add select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; min-width: 0; }
.set-add input { flex: 1 1 140px; }
.rulecard { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: var(--surface); }
.rulecard .form-grid { gap: 8px; }
.rule-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; color: var(--muted); font-weight: 700; }
.rule-head .acts { display: flex; gap: 6px; }

/* wallet flow cards */
.wcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.wcard.over { border-color: var(--spend); }
.wcard-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.wcard-name { font-weight: 700; }
.wcard-bal { font-weight: 800; font-size: 18px; }
.wcard-bal.neg { color: var(--spend); }
.wflow { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.wside { min-width: 0; }
.wside.out { text-align: right; }
.wline { display: flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 2px 0; white-space: nowrap; overflow: hidden; }
.wside.out .wline { justify-content: flex-end; }
.wline .lbl { overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.wline .amt { font-weight: 700; font-variant-numeric: tabular-nums; flex: none; }
.wline .amt { color: var(--ink); }
.wcard-suffix { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.warrow { font-size: 14px; flex: none; }
.warrow.in { color: var(--earn); } .warrow.out { color: var(--spend); } .warrow.mv { color: var(--move); }
.wmid { text-align: center; font-size: 11.5px; color: var(--muted); font-weight: 700; padding: 0 2px; }
.wbar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--sunken); margin-top: 10px; }
.wbar i { display: block; height: 100%; }
.wnone { color: var(--muted); font-size: 12.5px; }
.wnote { font-size: 12px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--muted); }
.wfoot { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: baseline; font-size: 12px; font-weight: 700; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.wfoot > span:last-child { text-align: right; }
.wfoot .mid { color: var(--muted); font-weight: 600; text-align: center; white-space: nowrap; }
.wnote.warn { color: var(--spend); font-weight: 600; }
.topbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
.topline { display: flex; align-items: baseline; gap: 8px; font-size: 14px; margin-bottom: 6px; }
.topline .tail { margin-left: auto; text-align: right; white-space: nowrap; flex: none; }
h2.sec .side, h2.sec .linkbtn.side { font-family: var(--sans); font-size: 13.5px; font-weight: 600; }
.onhand-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.onhand-row .onhand-total { font-size: clamp(24px, 7vw, 34px); }
.topline b { font-weight: 700; }
.topline .arrow { color: var(--muted); }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chartwrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 6px; overflow-x: auto; }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-inner { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { position: relative; border: 0; background: none; padding: 9px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab .dot { position: absolute; top: 4px; left: 50%; margin-left: 6px; background: var(--warn); color: #fff; font-size: 10.5px; font-weight: 800; border-radius: 999px; min-width: 18px; padding: 0 5px; line-height: 18px; text-align: center; }

/* rule prompt */

<script>
(function () {

const cleanTag = (t) => String(t || '').trim().replace(/^#/, '').toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9\u00f1_-]/g, '').slice(0, 30);

/* ================= defaults ================= */
const DEFAULT_CATEGORIES = [
  ['food','Food','expense'],['transportation','Transportation','expense'],['gas','Gas','expense'],['skincare','Skincare','expense'],
  ['sports','Sports','expense'],['presents','Presents','expense'],['vices','Vices','expense'],['business','Business','expense'],

const DEFAULT_WALLETS = [['cash','Cash'],['gcash','GCash'],['maya','Maya'],['bank','Bank'],['creditcard','Credit Card']].map(([id, name]) => ({ id, name, opening: 0 }));
const KEYWORDS = [
  ['fees', /\b(transfer fee|service charge|fee)\b/],
  ['salary', /\b(wages|salary|sweldo)\b/],
  ['family', /\b(from (mama|papa|lola|lolo|tita|tito|ate|kuya)|balato|hatag ni|bigay ni)\b/],
  ['payments', /\b(payment|bayad ni|reimburse|reimbursement|refund)\b/],
  ['bills', /\b(davao light|dlpc|electric|kuryente|water bill|internet|pldt|globe|smart|load|data)\b/],

  ['transportation', /\b(jeep|jeeps|trike|tricycle|grab ?car|grab|taxi|bus|riverboat|pauwi|otw|parking|habal|angkas|maxim|fare)\b/],
  ['vices', /\b(vape|relx|pod|alak|beer|puffs|yosi)\b/],
  ['sports', /\b(pickle|pickleball|pikolbol|tennis|badminton|billiards|bilyaran|court|ballboy|golf|bouldering|grip)\b/],
  ['skincare', /\b(watsons|sunscreen|napkins?|face ?wash|cleanser|celeteque|deo|shampoo|toothpaste|cotton|micellar|lotion|soap|sabon)\b/],
  ['presents', /\b(gift|give|hatag|pasalubong|church|charity|libre ko)\b/],
  ['business', /\b(business)\b/],
  ['home', /\b(shopee|walis|toothbrush holder|rack|downy|tissue)\b/],
  ['food', /\b(coffee|latte|americano|cafe|caf\u00e9|empanadas?|fish ?ball|pishbol|pisbol|kikiam|takoyaki|rice|snacks?|snax|ice ?cream|cake|donuts?|dd|munchkins|pizza|mcdo|jollibee|milk ?tea|bread|turon|siomai|water|lunch|dinner|breakfast|kwek ?kwek|cookies?|waffles?|food|meryenda|chowking|mang inasal|banana|binignit|puto|dunkin|frappe|matcha|tea|burger|sisig|ramen|chicken|bbq|curly tops|flat tops|pancakes?|hotcakes?|binangkal|maja|hopia|lasagna|croissant|croffles?|biscoff|yakult|coke|pocari|tanan klase)\b/],

/* ================= state ================= */
const state = {
  settings: null, months: new Map(), entries: [], index: new Map(), version: 0,
  tab: 'add', mode: 'items', itemsDate: todayISO(), overrides: {},
  reportView: 'month', reportMonth: curMK(), reportYear: new Date().getFullYear(),

function mergeSettings(raw) {

    categories: Array.isArray(s.categories) && s.categories.length ? s.categories : DEFAULT_CATEGORIES.map((c) => ({ ...c })),
    wallets: (() => { let w = Array.isArray(s.wallets) && s.wallets.length ? s.wallets : DEFAULT_WALLETS.map((x) => ({ ...x })); if (!w.some((x) => x.id === 'creditcard')) w = w.concat([{ id: 'creditcard', name: 'Credit Card', opening: 0, limit: 0 }]); return w; })(),

}
const cat = (id) => state.settings.categories.find((c) => c.id === id);
const catName = (id) => (id ? (cat(id) || { name: 'Unknown' }).name : 'No category');
const wallet = (id) => state.settings.wallets.find((w) => w.id === id);
const walletName = (id) => (wallet(id) || { name: 'Unknown wallet' }).name;
const expenseCats = () => state.settings.categories.filter((c) => c.type === 'expense');

function rebuild() {
  const list = [];
  const idx = new Map();
  for (const arr of state.months.values()) for (const e of arr) { list.push(e); idx.set(e.id, e); }
  list.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.ts || 0) - (b.ts || 0)));
  state.entries = list; state.index = idx; state.version++;
}

/* ================= storage ================= */
const store = {
  mode: 'none', queues: new Map(), listeners: [],
  async init() {
    let db = null, user = null;
    try {
      if (window.claude && typeof window.claude.use === 'function') {

        state.settings = mergeSettings(snap.exists ? snap.data() : null);

        const m = new Map();
        qs.docs.forEach((d) => { const data = d.data(); if (data && Array.isArray(data.entries)) m.set(d.id, data.entries); });

  commit({ put = [], del = [] }) {
    const plan = new Map();
    const bucket = (mk) => { if (!plan.has(mk)) plan.set(mk, { put: new Map(), del: new Set() }); return plan.get(mk); };

      jobs.push(this.changeMonth(mk, (cur) => {
        const seen = new Set();
        const out = [];
        for (const e of cur) {
          if (p.del.has(e.id)) continue;
          if (p.put.has(e.id)) { out.push(p.put.get(e.id)); seen.add(e.id); } else out.push(e);

function daysToMonths(days) {
  const months = {};
  for (const [date, list] of Object.entries(days)) {
    for (const e of list) {

/* ================= money math ================= */
const live = (e) => !e.hidden;
function walletDelta(e) {
  if (e.unpaid) return {};
  const a = round2(e.amount), d = {};
  const add = (w, v) => { if (w) d[w] = round2((d[w] || 0) + v); };
  switch (e.kind) {
    case 'expense': add(e.wallet, -a); break;
    case 'income': add(e.wallet, a); break;
    case 'transfer': add(e.wallet, -a - round2(e.fee || 0)); add(e.toWallet, a); break;
    case 'lent': case 'paid_back': add(e.wallet, -a); break;
    case 'borrowed': case 'got_back': add(e.wallet, a); break;
    default: break;
  }
  return d;
}
function spendOf(e) {
  if (e.hidden) return null;
  if (e.kind === 'expense') return [e.category || '', round2(e.amount)];
  if (e.kind === 'forgiven') return [e.category || 'presents', round2(e.amount)];
  if (e.kind === 'transfer' && e.fee) return ['fees', round2(e.fee)];
  return null;
}
const incomeOf = (e) => (e.kind === 'income' && !e.hidden ? round2(e.amount) : 0);
// wallet balances at the start of `asOf` (exclusive). Opening balances are "as of" settings.openingDate.
function balances(asOf) {
  const s = state.settings, open = s.openingDate || '0000-00-00';
  const b = {};
  s.wallets.forEach((w) => { b[w.id] = round2(w.opening || 0); });
  const until = asOf || '9999-12-31';

/* ================= receipt scan ================= */
let scanCtl = null;
$('#receipt-file').addEventListener('change', async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file || !state.sample) return;
  const status = $('#scan-status');
  scanCtl = new AbortController();
  if (status) { status.textContent = 'Reading the receipt\u2026 '; status.append(el('button', { class: 'linkbtn', type: 'button', text: 'Stop', onclick: () => scanCtl && scanCtl.abort() })); }
  const prompt = 'This photo is a store receipt from the Philippines; amounts are in Philippine pesos. ' +
    'Reply with only JSON in this shape: {"merchant": "short store name or null", "date": "YYYY-MM-DD or null", "items": [{"name": "short lowercase item name", "amount": 123.45}], "total": 123.45 or null}. ' +
    'Each item amount is the line total (quantity times price). Leave out subtotal, VAT, discounts already applied to a line, cash tendered and change. ' +
    'If you cannot read separate items, return "items": [] and give the total. Example: {"merchant": "watsons", "date": "2026-10-03", "items": [{"name": "sunscreen", "amount": 379}], "total": 379}';
  try {
    const res = await state.sample.json(prompt, { images: [file], signal: scanCtl.signal });
    const merchant = res && typeof res.merchant === 'string' ? res.merchant.trim().toLowerCase().slice(0, 40) : '';
    let items = Array.isArray(res && res.items) ? res.items.filter((i) => i && Number(i.amount) > 0).map((i) => ({ name: String(i.name || 'item').replace(/[(),#]/g, ' ').trim().toLowerCase().slice(0, 50), amount: round2(i.amount) })) : [];
    const total = res && Number(res.total) > 0 ? round2(res.total) : null;
    if (!items.length && total) items = [{ name: merchant || 'receipt', amount: total }];
    if (!items.length) { if (status) status.textContent = "Couldn't read any amounts. Try a clearer photo."; return; }
    const date = res && /^\d{4}-\d{2}-\d{2}$/.test(res.date || '') && res.date <= todayISO() && res.date >= todayISO(-365) ? res.date : todayISO();
    const wallet = state.settings.lastWallet, now = Date.now();
    const entries = items.map((i, idx) => {
      const label = merchant && i.name !== merchant ? i.name + ' - ' + merchant : i.name;
      const g = guessCategory({ name: label, incoming: false });
      return { id: uid(), ts: now + idx, date, kind: 'expense', item: label, amount: i.amount, category: g.id, wallet, tags: [], reviewed: g.how === 'rule' };
    });
    await store.commit({ put: entries });
    const sum = round2(items.reduce((s, i) => s + i.amount, 0));
    const waiting = entries.filter((e) => !e.reviewed).length;
    render();
    const st = $('#scan-status');
    const parts = ['Added ' + entries.length + (entries.length === 1 ? ' item' : ' items')];
    if (waiting) parts.push(waiting + ' need review');
    if (total && Math.abs(total - sum) > 0.5) parts.push('items add up to ' + peso(sum) + ' but the receipt total is ' + peso(total) + ', so double-check it');
    if (st) st.textContent = parts.join(', ') + '.';
  } catch (e) {
    const st = $('#scan-status');
    const copy = { cancelled: '', not_granted: 'Receipt scanning needs your permission to use Claude.', rate_limited: 'Too many scans at once. Wait a moment and try again.', image_rejected: "That photo couldn't be read. Try a JPG or PNG under 20 MB.", invalid_json: "Couldn't make sense of that receipt. Try a clearer photo." };
    if (st) st.textContent = copy[e && e.code] !== undefined ? copy[e.code] : "Couldn't scan the receipt. Try again.";
    if (e && e.code === 'not_granted') { state.sample = null; render(); }
  } finally {
    scanCtl = null;
  }
});

        const label = mine.length ? mine.map((idx) => withAmt[idx].name + ' (' + withAmt[idx].amount + ')').join(', ') : (c.name || (c.kind === 'income' ? 'income' : 'expense')) + ' from old sheet';
        const e = mkEntry({ name: label.slice(0, 120), amount: c.total, tags: [] }, c, false, ['check']);
        e.note = "Old sheet: the notes for this day didn't add up to this column's total.";
        put.push(e);
      });
      // anything left in the notes wasn't in any column total: keep it, hidden, for you to check
      withAmt.forEach((it, idx) => { if (!used.has(idx)) { const e = mkEntry(it, null, false, ['check']); e.hidden = true; e.note = "Old sheet: this wasn't counted in any column."; put.push(e); } });
    }
  }
  const del = state.entries.filter((e) => e.src === 'sheet' && monthsTouched.has(mkOf(e.date))).map((e) => e.id);
  const months = [...monthsTouched].sort();
  if (!put.length) return { error: 'No dated rows found in that sheet.' };
  return {
    kind: 'sheet', put, del, newCats,
    summary: [
      put.length + ' items from ' + days + ' days, ' + monthLabel(months[0]) + ' to ' + monthLabel(months[months.length - 1]),
      exact + ' matched your sheet\u2019s columns exactly and are ready',
      toReview + ' will go to your review list' + (mismatched ? ' (on ' + mismatched + ' days the notes didn\u2019t add up to the column totals, so those keep the sheet\u2019s totals)' : ''),
      unreadable ? unreadable + ' note items had no amount and were left out' : null,
      newCats.length ? 'New categories: ' + newCats.map((c) => c.name).join(', ') : null,
      del.length ? 'Replaces ' + del.length + ' transactions from your last import of these months' : null,
      'Old Utang column items are tagged #utang. Items to double-check are tagged #check; ones that weren\u2019t counted in any column are imported hidden.',
      'These entries won\u2019t change your current wallet balances; they\u2019re before your starting-balance date.',
    ].filter(Boolean),
  };
}
// best effort: exact solution if one exists, otherwise match whatever columns can be matched
function assignDay(items, cols) {
  const guess = items.map((it) => { const g = guessCategory({ name: it.name, incoming: it.incoming }); return cols.findIndex((c) => (c.kind === 'income' ? g.id && cat(g.id) && cat(g.id).type === 'income' : c.key === g.id)); });
  const full = solveDay(items, cols);
  if (full) return { assign: full, unmatched: [], guess };
  const cents = items.map((x) => Math.round(x.amount * 100));
  const assign = new Array(items.length).fill(-1), unmatched = [];
  let pool = items.map((_, i) => i);
  const order = cols.map((c, i) => i).sort((a, b) => cols[a].total - cols[b].total);
  for (const ci of order) {
    const target = Math.round(cols[ci].total * 100);
    let best = null, budget = 60000;
    const idx = pool.slice().sort((a, b) => cents[b] - cents[a]);
    const walk = (k, sum, chosen) => {
      if (--budget < 0) return;
      if (sum === target) { const sc = chosen.filter((i) => guess[i] === ci).length - chosen.length * 0.01; if (!best || sc > best.sc) best = { chosen: chosen.slice(), sc }; return; }
      if (k >= idx.length || sum > target) return;
      walk(k + 1, sum + cents[idx[k]], chosen.concat(idx[k])); walk(k + 1, sum, chosen);
    };
    if (idx.length <= 22) walk(0, 0, []);
    if (best && best.chosen.length) { best.chosen.forEach((i) => { assign[i] = ci; }); pool = pool.filter((i) => !best.chosen.includes(i)); }
    else unmatched.push(ci);
  }
  return { assign, unmatched, guess };
}
// assign each item to a column so every column total matches; -1 = not in any column
function solveDay(items, cols) {
  const n = items.length, cents = items.map((x) => Math.round(x.amount * 100));
  const guess = items.map((it) => { const g = guessCategory({ name: it.name, incoming: it.incoming }); const ci = cols.findIndex((c) => (c.kind === 'income' ? g.id && cat(g.id) && cat(g.id).type === 'income' : c.key === g.id)); return ci; });
  // quick path: the guesses already add up
  const sums = cols.map(() => 0); guess.forEach((ci, i) => { if (ci >= 0) sums[ci] += cents[i]; });
  if (cols.every((c, ci) => sums[ci] === Math.round(c.total * 100))) return guess;
  if (n > 18) return null;
  const order = cols.map((c, i) => i).sort((a, b) => cols[a].total - cols[b].total);
  const assign = new Array(n).fill(-1);
  let budget = 300000;
  const subsets = (pool, target, ci) => {
    const res = [];
    const idx = pool.slice().sort((a, b) => cents[b] - cents[a]);
    const walk = (k, sum, chosen) => {
      if (--budget < 0 || res.length > 40) return;
      if (sum === target) { res.push(chosen.slice()); return; }
      if (k >= idx.length || sum > target) return;
      walk(k + 1, sum + cents[idx[k]], chosen.concat(idx[k]));
      walk(k + 1, sum, chosen);
    };
    walk(0, 0, []);
    return res.sort((a, b) => b.filter((i) => guess[i] === ci).length - a.filter((i) => guess[i] === ci).length);
  };
  const go = (oi, pool) => {
    if (oi === order.length) return true;
    const ci = order[oi];
    for (const sub of subsets(pool, Math.round(cols[ci].total * 100), ci)) {
      sub.forEach((i) => { assign[i] = ci; });
      if (go(oi + 1, pool.filter((i) => !sub.includes(i)))) return true;
      sub.forEach((i) => { assign[i] = -1; });
      if (budget < 0) return false;
    }
    return false;
  };
  return go(0, items.map((_, i) => i)) ? assign.slice() : null;
}
function showImportPlan() {
  const out = $('#import-result'); if (!out) return;
  out.innerHTML = '';
  if (state.importDone) { out.append(el('div', { class: 'banner info' }, el('span', { text: state.importDone }), el('button', { class: 'linkbtn', type: 'button', text: 'Go to review', onclick: () => { state.tab = 'add'; render(); } }))); return; }
  const plan = state.importPlan; if (!plan) return;
  if (plan.importing) { out.append(el('div', { class: 'muted', text: plan.importing })); return; }
  if (plan.error) { out.append(el('div', { class: 'form-msg', text: plan.error })); return; }
  const btn = el('button', { class: 'btn', type: 'button', text: 'Import ' + plan.put.length + ' transactions' });
  const msg = el('div', { class: 'muted' });
  btn.addEventListener('click', async () => {
    btn.disabled = true; btn.textContent = 'Importing\u2026'; plan.importing = 'Importing\u2026';
    try {
      if (plan.newCats && plan.newCats.length) await store.saveSettings({ categories: state.settings.categories.concat(plan.newCats) });
      if (plan.kind === 'sheet' && !state.settings.openingDate) await store.saveSettings({ openingDate: firstOwnDate() });
      const put = plan.put.slice();
      const del = plan.del.slice();
      if (del.length) await store.commit({ del });
      for (let i = 0; i < put.length; i += 400) { await store.commit({ put: put.slice(i, i + 400) }); plan.importing = 'Saved ' + Math.min(put.length, i + 400) + ' of ' + put.length + '\u2026'; showImportPlan(); }
      state.importDone = 'Imported ' + put.length + ' transactions.'; state.importPlan = null; showImportPlan();
    } catch (e) { saveError(e); plan.importing = null; showImportPlan(); }
  });
  out.append(el('ul', { class: 'muted', style: 'padding-left:18px;margin:0 0 12px' }, plan.summary.map((s) => el('li', { text: s }))), btn, msg);
}
function buildWorkbook() {
  const wb = XLSX.utils.book_new();
  const expC = expenseCats();
  const entries = state.entries;
  const years = [...new Set(entries.map((e) => e.date.slice(0, 4)))].sort().reverse();
  for (const y of years) {
    const rows = [];
    for (let m = 12; m >= 1; m--) {
      const key = y + '-' + pad(m);
      const me = monthEntries(key).slice().sort((a, b) => (a.date < b.date ? -1 : 1));
      if (!me.length) continue;
      rows.push([MONTHS[m - 1].toUpperCase()]);
      rows.push(['Date', ...expC.map((c) => c.name), 'Uncategorized', 'Income', 'Notes']);
      [...new Set(me.map((e) => e.date))].sort().reverse().forEach((d) => {
        const de = me.filter((e) => e.date === d);
        const s = summarize(de);
        const notes = de.map((e) => describe(e).name + ' (' + round2(e.amount) + ')' + (e.hidden ? ' [hidden]' : '')).join(', ');
        rows.push([d, ...expC.map((c) => s.cats[c.id] || null), s.cats[''] || null, s.income || null, notes]);
      });
      const s = summarize(me);
      rows.push(['Totals', ...expC.map((c) => s.cats[c.id] || 0), s.cats[''] || 0, s.income]);
      rows.push(['Income', s.income]); rows.push(['Expenses', s.spent]);
      rows.push(['Started with', totalOf(balances(key + '-01'))]); rows.push(['Ended with', totalOf(balances(addMonths(key, 1) + '-01'))]);
      rows.push([]);
    }
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{ wch: 12 }, ...expC.map(() => ({ wch: 13 })), { wch: 13 }, { wch: 12 }, { wch: 80 }];
    XLSX.utils.book_append_sheet(wb, ws, y);
  }
  const all = [['ID', 'Date', 'Type', 'Item', 'Pcs', 'Category', 'Wallet', 'To wallet', 'Person', 'Amount', 'Fee', 'Tags', 'Note', 'Hidden', 'Needs review']];
  entries.forEach((e) => all.push([e.id, e.date, e.kind, e.item || '', e.pcs || '', e.category ? catName(e.category) : '', e.wallet ? walletName(e.wallet) : '', e.toWallet ? walletName(e.toWallet) : '', e.person || '', round2(e.amount), e.fee || '', (e.tags || []).join(', '), e.note || '', e.hidden ? 'yes' : '', e.reviewed === false ? 'yes' : '']));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(all), 'All transactions');
  return wb;
}
async function exportXlsx(msg) {
  msg.textContent = '';
  if (!window.XLSX) { msg.textContent = "The Excel tool didn't load. Reload the page and try again."; return; }
  if (!state.entries.length) { msg.textContent = 'There are no entries to export yet.'; return; }
  const data = XLSX.write(buildWorkbook(), { type: 'array', bookType: 'xlsx' });
  const blob = new Blob([data], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const filename = 'Moneyfest ' + todayISO() + '.xlsx';
  const dl = state.downloads;
  if (dl) { try { await dl.save({ filename, data: blob }); } catch (e) { if (e.code !== 'declined') msg.textContent = "The download didn't go through. Try again in a moment."; } }
  else { const a = el('a', { href: URL.createObjectURL(blob), download: filename }); document.body.append(a); a.click(); a.remove(); }
}

/* ================= render & nav ================= */
function render() {
  if (!state.settings) return;
  const app = $('#app');
  const y = window.scrollY;
  // remember which field had focus so a redraw doesn't kick the person out of it
  const ae = document.activeElement;
  const fkey = ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName) && $('#app').contains(ae) ? (ae.id ? ['id', ae.id] : ae.getAttribute('aria-label') ? ['aria-label', ae.getAttribute('aria-label')] : ae.getAttribute('placeholder') ? ['placeholder', ae.getAttribute('placeholder')] : null) : null;
  const fsel = fkey && typeof ae.selectionStart === 'number' ? [ae.selectionStart, ae.selectionEnd] : null;
  app.innerHTML = '';
  if (state.bannerMsg) app.append(el('div', { class: 'banner', text: state.bannerMsg }));
  const views = { add: viewAdd, entries: viewEntries, plan: viewPlan, reports: viewReports, more: viewMore };
  app.append((views[state.tab] || viewAdd)());
  $$('.tab').forEach((t) => { if (t.dataset.tab === state.tab) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
  const n = state.entries.filter((e) => e.reviewed === false).length;
  const dot = $('#review-dot'); dot.hidden = !n; dot.textContent = n > 99 ? '99+' : String(n);
  renderBulkbar();
  if (render.keepScroll) window.scrollTo(0, y);
  if (fkey) {
    const target = $$('#app input, #app select, #app textarea').find((n) => (fkey[0] === 'id' ? n.id === fkey[1] : n.getAttribute(fkey[0]) === fkey[1]));
    if (target) { target.focus({ preventScroll: true }); if (fsel && typeof target.setSelectionRange === 'function') { try { target.setSelectionRange(fsel[0], fsel[1]); } catch (e) { /* number inputs */ } } }
  }
}
render.keepScroll = true;
$$('.tab').forEach((t) => t.addEventListener('click', () => {
  if (state.tab !== t.dataset.tab) { state.tab = t.dataset.tab; if (state.tab === 'more') state.more = 'menu'; if (state.tab !== 'entries') { state.selecting = false; state.selected.clear(); } }
  render.keepScroll = false; render(); render.keepScroll = true; window.scrollTo(0, 0);
}));
$('#scrim').addEventListener('click', (e) => { if (e.target.id === 'scrim') closeSheet(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (!$('#scrim').hidden) closeSheet(); else if (!$('#recap').hidden) $('#recap').hidden = true; } });

store.listeners.push(() => {
  // don't redraw under someone mid-typing in a sheet; the sheet reads fresh data when it saves
  render();
});
state.settings = mergeSettings(null);
render();
store.init().catch((e) => { console.error(e); showBanner("Couldn't load your data. Reload the page to try again."); });


})();
